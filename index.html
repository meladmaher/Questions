        }

            right: 15px;
            top: 50%;
            transform: translateY(-50%);

            font-size: 24px;
            font-weight: bold;
        }

        const resultsContainer = document.getElementById('resultsContainer');
        const questionType = document.getElementById('questionType');
        const questionNumber = document.getElementById('questionNumber');
        const questionText = document.getElementById('questionText');
        const optionsArea = document.getElementById('optionsArea');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const finalScore = document.getElementById('finalScore');
        const finalGrade = document.getElementById('finalGrade');
        const funnyMessage = document.getElementById('funnyMessage');
        const mistakesList = document.getElementById('mistakesList');
        const restartBtn = document.getElementById('restartBtn');
        const totalQuestionsEl = document.getElementById('totalQuestions');
        const remainingQuestionsEl = document.getElementById('remainingQuestions');
        const correctCountEl = document.getElementById('correctCount');
        
        // متغيرات حالة الاختبار
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];
        let quizFinished = false;
        
        // تهيئة الاختبار
        function initQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            quizFinished = false;
            
            quizContainer.style.display = 'block';
            resultsContainer.style.display = 'none';
            
            totalQuestionsEl.textContent = allQuestions.length;
            remainingQuestionsEl.textContent = allQuestions.length;
            correctCountEl.textContent = '0';
            
            showQuestion();
        }
        
        // عرض السؤال الحالي
        function showQuestion() {
            const question = allQuestions[currentQuestion];
            
            // تحديد نوع السؤال
            if (question.isTF) {
                questionType.textContent = "صح أم خطأ";
                questionType.style.background = "#e74c3c";
            } else {
                questionType.textContent = "اختياري";
                questionType.style.background = "#3498db";
            }
            
            questionNumber.textContent = `السؤال ${currentQuestion + 1} من ${allQuestions.length}`;
            questionText.textContent = question.question;
            
            // تحديث شريط التقدم
            const progress = ((currentQuestion) / allQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            
            // تحديث معلومات الاختبار
            remainingQuestionsEl.textContent = allQuestions.length - currentQuestion;
            correctCountEl.textContent = score;
            
            // إنشاء الخيارات حسب نوع السؤال
            optionsArea.innerHTML = '';
            
            if (question.isTF) {
                const container = document.createElement('div');
                container.classList.add('true-false-container');
                
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.classList.add('option');
                    optionElement.textContent = option;
                    
                    // إذا كانت هناك إجابة سابقة، عرضها
                    if (userAnswers[currentQuestion] !== undefined) {
                        if (userAnswers[currentQuestion] === index) {
                            optionElement.classList.add('selected');
                            if (index === question.correctAnswer) {
                                optionElement.classList.add('correct');
                            } else {
                                optionElement.classList.add('incorrect');
                            }
                        } else if (index === question.correctAnswer) {
                            optionElement.classList.add('correct');
                        }
                    }
                    
                    optionElement.addEventListener('click', () => selectOption(index));
                    container.appendChild(optionElement);
                });
                
                optionsArea.appendChild(container);
            } else {
                const container = document.createElement('div');
                container.classList.add('options-container');
                
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.classList.add('option');
                    optionElement.textContent = option;
                    
                    // إذا كانت هناك إجابة سابقة، عرضها
                    if (userAnswers[currentQuestion] !== undefined) {
                        if (userAnswers[currentQuestion] === index) {
                            optionElement.classList.add('selected');
                            if (index === question.correctAnswer) {
                                optionElement.classList.add('correct');
                            } else {
                                optionElement.classList.add('incorrect');
                            }
                        } else if (index === question.correctAnswer) {
                            optionElement.classList.add('correct');
                        }
                    }
                    
                    optionElement.addEventListener('click', () => selectOption(index));
                    container.appendChild(optionElement);
                });
                
                optionsArea.appendChild(container);
            }
            
            // تعطيل زر التالي حتى يتم اختيار إجابة
            nextBtn.disabled = true;
        }
        
        // اختيار إجابة
        function selectOption(optionIndex) {
            // إذا انتهى السؤال بالفعل، لا تفعل شيئاً
            if (userAnswers[currentQuestion] !== undefined) return;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => option.classList.remove('selected'));
            
            options[optionIndex].classList.add('selected');
            nextBtn.disabled = false;
            
            // حفظ الإجابة
            userAnswers[currentQuestion] = optionIndex;
            
            // التحقق من الإجابة
            const question = allQuestions[currentQuestion];
            if (optionIndex === question.correctAnswer) {
                options[optionIndex].classList.add('correct');
                score++;
                correctCountEl.textContent = score;
            } else {
                options[optionIndex].classList.add('incorrect');
                options[question.correctAnswer].classList.add('correct');
            }
        }
        
        // الانتقال إلى السؤال التالي
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < allQuestions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }
        
        // إنهاء الاختبار وعرض النتائج
        function finishQuiz() {
            quizFinished = true;
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            
            // حساب النتيجة
            const percentage = Math.round((score / allQuestions.length) * 100);
            finalScore.textContent = `${score}/${allQuestions.length}`;
            
            // تحديد النجاح أو الرسوب (60% للنجاح)
            const isPass = percentage >= 60;
            
            if (isPass) {
                finalScore.classList.add('pass');
                finalGrade.textContent = "ناجح";
                finalGrade.style.color = "#27ae60";
                funnyMessage.textContent = "ناجح دحيح الدفعة 🙂";
                funnyMessage.className = "funny-message pass-message";
            } else {
                finalScore.classList.remove('pass');
                finalGrade.textContent = "ساقط";
                finalGrade.style.color = "#e74c3c";
                funnyMessage.textContent = "يخربيتك هتودينا في داهيه يا ساقط 😂";
                funnyMessage.className = "funny-message fail-message";
            }
            
            // عرض الأسئلة الخاطئة
            mistakesList.innerHTML = '';
            allQuestions.forEach((question, index) => {
                if (userAnswers[index] !== question.correctAnswer) {
                    const mistakeItem = document.createElement('div');
                    mistakeItem.classList.add('mistake-item');
                    
                    const mistakeQuestion = document.createElement('div');
                    mistakeQuestion.classList.add('mistake-question');
                    mistakeQuestion.textContent = `${index + 1}. ${question.question}`;
                    
                    const userAnswer = document.createElement('div');
                    userAnswer.classList.add('incorrect-answer');
                    
                    if (question.isTF) {
                        userAnswer.textContent = `إجابتك: ${userAnswers[index] === 0 ? "True" : "False"}`;
                    } else {
                        userAnswer.textContent = `إجابتك: ${question.options[userAnswers[index]]}`;
                    }
                    
                    const correctAnswer = document.createElement('div');
                    correctAnswer.classList.add('correct-answer');
                    
                    if (question.isTF) {
                        correctAnswer.textContent = `الإجابة الصحيحة: ${question.correctAnswer === 0 ? "True" : "False"}`;
                    } else {
                        correctAnswer.textContent = `الإجابة الصحيحة: ${question.options[question.correctAnswer]}`;
                    }
                    
                    mistakeItem.appendChild(mistakeQuestion);
                    mistakeItem.appendChild(userAnswer);
                    mistakeItem.appendChild(correctAnswer);
                    mistakesList.appendChild(mistakeItem);
                }
            });
            
            // إذا لم تكن هناك أخطاء
            if (mistakesList.innerHTML === '') {
                const noMistakes = document.createElement('div');
                noMistakes.classList.add('mistake-item');
                noMistakes.textContent = 'لا توجد أخطاء! جميع إجاباتك صحيحة. أنت أسطورة! 🏆';
                noMistakes.style.textAlign = 'center';
                noMistakes.style.fontWeight = 'bold';
                noMistakes.style.color = '#27ae60';
                mistakesList.appendChild(noMistakes);
            }
        }
        
        // إضافة المستمعين للأزرار
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', initQuiz);
        
        // بدء الاختبار
        initQuiz();
    </script>
</body>
</html>
