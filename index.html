<html lang="ar" dir="rtl">
<head>

        * {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
         {
            background: linear-gradient(135deg, #16A085, #2ECC71, #16A085);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #16A085;
        }
        
        h1 {
            color: #16A085;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #2ECC71;
            font-size: 18px;
            font-weight: 500;
        }
        
        .quiz-info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            background: #e8f8f5;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .progress-container {
            margin: 20px 0;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #16A085, #2ECC71);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .question-container {
            margin: 25px 0;
        }
        
        .question-number {
            font-size: 18px;
            color: #2ECC71;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .question-text {
            font-size: 22px;
            margin-bottom: 25px;
            color: #16A085;
            font-weight: 600;
            line-height: 1.8;
            background: #f2fcf9;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #16A085;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .true-false-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option {
            background-color: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .option:hover {
            background-color: #e9e9e9;
            border-color: #16A085;
        }
        
        .option.selected {
            border-color: #16A085;
            background-color: #d1f2eb;
        }
        
        .option.correct {
            border-color: #27ae60;
            background-color: #d5f4e6;
        }
        
        .option.incorrect {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }
        
        .option.correct::after {
            content: '✓';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #27ae60;
            font-size: 24px;
            font-weight: bold;
        }
        
        .option.incorrect::after {
            content: '✗';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #e74c3c;
            font-size: 24px;
            font-weight: bold;
        }
        
        .btn {
            background: linear-gradient(to right, #16A085, #2ECC71);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results-container {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .results-title {
            font-size: 32px;
            color: #16A085;
            margin-bottom: 20px;
        }
        
        .score {
            font-size: 80px;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }
        
        .score.pass {
            color: #27ae60;
        }
        
        .grade {
            font-size: 28px;
            color: #16A085;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .funny-message {
            font-size: 24px;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 80%;
            font-weight: bold;
        }
        
        .fail-message {
            background-color: #fadbd8;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }
        
        .pass-message {
            background-color: #d5f4e6;
            color: #27ae60;
            border: 2px solid #27ae60;
        }

            color: #2ECC71;

            text-align: right;
            border-bottom: 2px solid #eee;

            padding: 20px;
            margin-bottom: 20px;

            font-size: 20px;
            font-weight: 600;
            color: #16A085;
            margin-bottom: 15px;
        }
        
        .incorrect-answer {
            color: #e74c3c;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .correct-answer {
            color: #27ae60;
            font-size: 18px;
            font-weight: bold;
        }
        
        .final-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .restart-btn {
            background: linear-gradient(to right, #27ae60, #2ecc71);
        }
        
        .question-type {
            background: #2ECC71;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            display: inline-block;
            margin-bottom: 10px;

            }

            }

            }
            
            .true-false-container {
                grid-template-columns: 1fr;
            }
            
            .funny-message {
                font-size: 20px;
            }
        }

</head>

        // دمج الأسئلة: أول 48 اختيارية ثم 52 صح/خطأ
        const allQuestions = [...mcqQuestions, ...tfQuestions.map(q => ({

            options: ["صح", "خطأ"],
            correctAnswer: q.answer ? 0 : 1,

        // العناصر الأساسية في الصفحة
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');

        const questionNumber = document.getElementById('questionNumber');
        const questionText = document.getElementById('questionText');
        const optionsArea = document.getElementById('optionsArea');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const finalScore = document.getElementById('finalScore');
        const finalGrade = document.getElementById('finalGrade');
        const funnyMessage = document.getElementById('funnyMessage');
        const mistakesList = document.getElementById('mistakesList');
        const restartBtn = document.getElementById('restartBtn');
        const totalQuestionsEl = document.getElementById('totalQuestions');
        const remainingQuestionsEl = document.getElementById('remainingQuestions');

        // متغيرات حالة الاختبار

        let score = 0;
        let userAnswers = [];
        let quizFinished = false;
        
        // تهيئة الاختبار
        function initQuiz() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            quizFinished = false;
            
            quizContainer.style.display = 'block';
            resultsContainer.style.display = 'none';
            
            totalQuestionsEl.textContent = allQuestions.length;
            remainingQuestionsEl.textContent = allQuestions.length;
            correctCountEl.textContent = '0';
            
            showQuestion();
        }
        
        // عرض السؤال الحالي
        function showQuestion() {
            const question = allQuestions[currentQuestion];
            
            // تحديد نوع السؤال
            if (question.isTF) {
                questionType.textContent = "صح أم خطأ";
                questionType.style.background = "#e74c3c";
            } else {
                questionType.textContent = "اختياري";
                questionType.style.background = "#2ECC71";
            }
            
            questionNumber.textContent = `السؤال ${currentQuestion + 1} من ${allQuestions.length}`;
            questionText.textContent = question.question;
            
            // تحديث شريط التقدم
            const progress = ((currentQuestion) / allQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            
            // تحديث معلومات الاختبار
            remainingQuestionsEl.textContent = allQuestions.length - currentQuestion;
            correctCountEl.textContent = score;
            
            // إنشاء الخيارات حسب نوع السؤال
            optionsArea.innerHTML = '';
            
            if (question.isTF) {
                const container = document.createElement('div');
                container.classList.add('true-false-container');
                
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.classList.add('option');
                    optionElement.textContent = option;
                    
                    // إذا كانت هناك إجابة سابقة، عرضها
                    if (userAnswers[currentQuestion] !== undefined) {
                        if (userAnswers[currentQuestion] === index) {
                            optionElement.classList.add('selected');
                            if (index === question.correctAnswer) {
                                optionElement.classList.add('correct');
                            } else {
                                optionElement.classList.add('incorrect');
                            }
                        } else if (index === question.correctAnswer) {
                            optionElement.classList.add('correct');
                        }
                    }
                    
                    optionElement.addEventListener('click', () => selectOption(index));
                    container.appendChild(optionElement);
                });
                
                optionsArea.appendChild(container);
            } else {
                const container = document.createElement('div');
                container.classList.add('options-container');
                
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.classList.add('option');
                    optionElement.textContent = option;
                    
                    // إذا كانت هناك إجابة سابقة، عرضها
                    if (userAnswers[currentQuestion] !== undefined) {
                        if (userAnswers[currentQuestion] === index) {
                            optionElement.classList.add('selected');
                            if (index === question.correctAnswer) {
                                optionElement.classList.add('correct');
                            } else {
                                optionElement.classList.add('incorrect');
                            }
                        } else if (index === question.correctAnswer) {
                            optionElement.classList.add('correct');
                        }
                    }
                    
                    optionElement.addEventListener('click', () => selectOption(index));
                    container.appendChild(optionElement);
                });
                
                optionsArea.appendChild(container);
            }
            
            // تعطيل زر التالي حتى يتم اختيار إجابة
            nextBtn.disabled = true;
        }
        
        // اختيار إجابة
        function selectOption(optionIndex) {
            // إذا انتهى السؤال بالفعل، لا تفعل شيئاً
            if (userAnswers[currentQuestion] !== undefined) return;
            
            const options = document.querySelectorAll('.option');
            options.forEach(option => option.classList.remove('selected'));
            
            options[optionIndex].classList.add('selected');
            nextBtn.disabled = false;
            
            // حفظ الإجابة
            userAnswers[currentQuestion] = optionIndex;
            
            // التحقق من الإجابة
            const question = allQuestions[currentQuestion];
            if (optionIndex === question.correctAnswer) {
                options[optionIndex].classList.add('correct');
                score++;
                correctCountEl.textContent = score;
            } else {
                options[optionIndex].classList.add('incorrect');
                options[question.correctAnswer].classList.add('correct');
            }
        }
        
        // الانتقال إلى السؤال التالي
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < allQuestions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }
        
        // إنهاء الاختبار وعرض النتائج
        function finishQuiz() {
            quizFinished = true;
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            
            // حساب النتيجة
            const percentage = Math.round((score / allQuestions.length) * 100);
            finalScore.textContent = `${score}/${allQuestions.length}`;
            
            // تحديد النجاح أو الرسوب (60% للنجاح)
            const isPass = percentage >= 60;
            
            if (isPass) {
                finalScore.classList.add('pass');
                finalGrade.textContent = "ناجح";
                finalGrade.style.color = "#27ae60";
                funnyMessage.textContent = "ناجح دحيح الدفعة 🙂";
                funnyMessage.className = "funny-message pass-message";
            } else {
                finalScore.classList.remove('pass');
                finalGrade.textContent = "ساقط";
                finalGrade.style.color = "#e74c3c";
                funnyMessage.textContent = "يخربيتك هتودينا في داهيه يا ساقط 😂";
                funnyMessage.className = "funny-message fail-message";
            }
            
            // عرض الأسئلة الخاطئة
            mistakesList.innerHTML = '';
            allQuestions.forEach((question, index) => {
                if (userAnswers[index] !== question.correctAnswer) {
                    const mistakeItem = document.createElement('div');
                    mistakeItem.classList.add('mistake-item');
                    
                    const mistakeQuestion = document.createElement('div');
                    mistakeQuestion.classList.add('mistake-question');
                    mistakeQuestion.textContent = `${index + 1}. ${question.question}`;
                    
                    const userAnswer = document.createElement('div');
                    userAnswer.classList.add('incorrect-answer');
                    
                    if (question.isTF) {
                        userAnswer.textContent = `إجابتك: ${userAnswers[index] === 0 ? "صح" : "خطأ"}`;
                    } else {
                        userAnswer.textContent = `إجابتك: ${question.options[userAnswers[index]]}`;
                    }
                    
                    const correctAnswer = document.createElement('div');
                    correctAnswer.classList.add('correct-answer');
                    
                    if (question.isTF) {
                        correctAnswer.textContent = `الإجابة الصحيحة: ${question.correctAnswer === 0 ? "صح" : "خطأ"}`;
                    } else {
                        correctAnswer.textContent = `الإجابة الصحيحة: ${question.options[question.correctAnswer]}`;
                    }
                    
                    mistakeItem.appendChild(mistakeQuestion);
                    mistakeItem.appendChild(userAnswer);
                    mistakeItem.appendChild(correctAnswer);
                    mistakesList.appendChild(mistakeItem);
                }
            });
            
            // إذا لم تكن هناك أخطاء
            if (mistakesList.innerHTML === '') {
                const noMistakes = document.createElement('div');
                noMistakes.classList.add('mistake-item');
                noMistakes.textContent = 'لا توجد أخطاء! جميع إجاباتك صحيحة. أنت خبير اقتصاديات التكنولوجيا! 🏆';
                noMistakes.style.textAlign = 'center';
                noMistakes.style.fontWeight = 'bold';
                noMistakes.style.color = '#27ae60';
                mistakesList.appendChild(noMistakes);
            }
        }
        
        // إضافة المستمعين للأزرار
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', initQuiz);
        
        // بدء الاختبار
        initQuiz();
